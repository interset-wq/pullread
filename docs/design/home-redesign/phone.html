<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#ECEAE2;font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;gap:36px;padding:56px 48px;align-items:flex-start;flex-wrap:wrap}
.phone{width:400px;flex:none;background:#FBFAF6;border-radius:28px;overflow:hidden;
  box-shadow:0 12px 40px rgba(30,40,30,.14);position:relative}
.tag{position:absolute;top:-36px;left:6px;font-size:18px;font-weight:700;color:#3E5C4F}
.tag small{font-weight:400;color:#8A887E;margin-left:10px;font-size:14px}
.frame{overflow:hidden;position:relative;background:#FBFAF6}
.hd{display:flex;align-items:center;padding:26px 20px 14px}
.badge{background:#E5443B;color:#fff;border-radius:9px;font-size:11px;padding:1px 5px;
  position:absolute;top:-8px;right:-10px;font-weight:600}
.fab{position:absolute;right:18px;bottom:18px;width:52px;height:52px;border-radius:18px;
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:600;
  background:#1F6F54;color:#FBFAF6;box-shadow:0 6px 16px rgba(31,111,84,.35)}
.sec{display:flex;align-items:center;font-size:13px;color:#8A887E;margin:18px 20px 8px;letter-spacing:.02em}
.sec .more{margin-left:auto;font-size:12px;color:#1F6F54;font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #F2F0E8}
.card{background:#fff;border:1px solid #E5E2D8;border-radius:16px;padding:13px 16px;
  display:flex;align-items:center;gap:12px;margin-bottom:10px;min-width:0;overflow:hidden}
.mono{width:40px;height:40px;border-radius:12px;background:#1F6F54;color:#FBFAF6;display:flex;
  align-items:center;justify-content:center;font-size:17px;font-weight:700;flex:none}
.chev{flex:none;margin-left:auto}
.seg{display:flex;background:#ECEAE2;border-radius:12px;padding:3px;margin:14px 16px 0}
.seg div{flex:1;text-align:center;font-size:13.5px;padding:8px 0;border-radius:10px;color:#8A887E;font-weight:600}
.seg .on{background:#fff;color:#1F6F54;box-shadow:0 1px 4px rgba(30,40,30,.12)}
.hero{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid #EFEDE5}
.hero .meta{font-size:11px;color:#8A887E;letter-spacing:.06em}
.hero .ttl{font-size:16px;font-weight:600;color:#26241E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.bar{height:3px;background:#EFEDE5;border-radius:2px;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:#1F6F54;border-radius:2px}
.sub{font-size:12px;color:#A5A296;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 平板 */
.tab{width:620px;flex:none;background:#FBFAF6;border-radius:24px;overflow:hidden;
  box-shadow:0 12px 40px rgba(30,40,30,.14);position:relative}
.tab .sec{margin:16px 24px 8px}
.land{width:960px;flex:none;background:#FBFAF6;border-radius:24px;overflow:hidden;
  box-shadow:0 12px 40px rgba(30,40,30,.14);position:relative}
.land .body{display:flex;height:700px;overflow:hidden}
.land .left{width:340px;flex:none;border-right:1px solid #EFEDE5;overflow:hidden}
.land .right{flex:1;padding:20px 20px 0;min-width:0;overflow:hidden}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .card{margin-bottom:0;min-width:0;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:6px}
</style></head><body>
