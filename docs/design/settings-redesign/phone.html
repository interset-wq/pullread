<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#ECEAE2;font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;gap:36px;padding:60px 48px;align-items:flex-start}
.phone{width:390px;height:845px;flex:none;background:#FBFAF6;border-radius:28px;overflow:hidden;position:relative;
  box-shadow:0 12px 40px rgba(30,40,30,.14)}
.tag{position:absolute;top:-34px;left:6px;font-size:18px;font-weight:700;color:#3E5C4F}
.tag small{font-weight:400;color:#8A887E;margin-left:10px;font-size:14px}
.bar{display:flex;align-items:center;gap:12px;padding:14px 14px 12px}
.bar .bt{width:22px;height:22px;flex:none}
.bar .ttl{font-size:17px;font-weight:600;color:#26241E;flex:1;min-width:0}
.bar .act{font-size:13.5px;color:#1F6F54;font-weight:600;white-space:nowrap}
.gh{font-size:12.5px;font-weight:700;color:#8A887E;letter-spacing:.06em;padding:18px 16px 6px}
/* 输入行：章 + 标题/? + 输入框 */
.irow{display:flex;align-items:center;gap:14px;padding:6px 16px 0}
.ic{width:38px;height:38px;border-radius:11px;background:#EDF5F0;color:#1F6F54;
  display:flex;align-items:center;justify-content:center;flex:none}
.irow .n1{font-size:15px;font-weight:500;color:#26241E}
.irow .hb{margin-left:4px;color:#B0ADA2;display:flex}
/* 输入框：白卡 token */
.field{margin:10px 16px 0;background:#fff;border:1.5px solid #E5E2D8;border-radius:12px;padding:11px 14px}
.field .val{font-size:15px;color:#26241E}
.field .cursor{display:inline-block;width:2px;height:18px;background:#1F6F54;vertical-align:-3px;margin-left:1px}
.field.focus{border-color:#1F6F54;box-shadow:0 0 0 3px rgba(31,111,84,.12)}
.field .ph{color:#B0ADA2}
.helper{font-size:12px;color:#A5A296;padding:7px 18px 0;line-height:1.6}
.saved{display:inline-flex;align-items:center;gap:5px;margin:8px 18px 0;font-size:12px;color:#1F6F54;
  background:#EDF5F0;border-radius:999px;padding:4px 11px}
.hair{height:1px;background:#F2F0E8;margin:16px 16px 0}
/* 规则 chips + 就地展开 textarea */
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px 0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#5A5850;background:#F1EFE7;
  border-radius:999px;padding:5px 8px 5px 12px}
.chip .x{color:#B0ADA2;display:flex}
.ta{margin:12px 16px 0;background:#fff;border:1.5px solid #1F6F54;border-radius:12px;padding:12px 14px;
  box-shadow:0 0 0 3px rgba(31,111,84,.12)}
.ta .line{font-size:14px;line-height:1.9;color:#26241E}
.ta .empty{color:#B0ADA2}
.tacts{display:flex;gap:10px;margin:12px 16px 0}
.btn{font-size:13.5px;font-weight:600;border-radius:11px;padding:9px 18px}
.btn.pri{background:#1F6F54;color:#fff}
.btn.sec{background:#fff;color:#3A382F;border:1px solid #E5E2D8}
</style></head><body>

<!-- 帧 1：用户名输入 · 输入态 + 保存反馈 -->
<div class="phone"><div class="tag">用户名输入<small>章 + token 描边 + 聚焦松绿 + 保存反馈</small></div>
  <div class="bar">
    <svg class="bt" viewBox="0 0 24 24" fill="none" stroke="#4A4840" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
    <div class="ttl">仓库与同步</div>
    <span class="act">恢复默认</span>
  </div>
  <div class="gh">默认平台</div>
  <div style="padding:4px 16px 0">
    <div style="display:flex;align-items:center;gap:12px;padding:10px 0">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1F6F54" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3v18"/></svg>
      <span style="font-size:15px;color:#26241E">GitCode（AtomGit）</span>
      <svg style="margin-left:auto" width="18" height="18" viewBox="0 0 24 24" fill="#1F6F54"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4" fill="#fff"/></svg>
    </div>
  </div>
  <div class="hair"></div>
  <div class="gh">默认用户名</div>
  <div class="irow">
    <div class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1F6F54" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.4-3.6 4.4-6 8-6s6.6 2.4 8 6"/></svg></div>
    <div class="n1">用户名</div>
    <span class="hb"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#B0ADA2" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.1"/></svg></span>
  </div>
  <div class="field focus" style="display:flex;align-items:center;gap:9px;padding:8px 8px 8px 14px">
    <span class="val" style="flex:1">interset-wq</span><span class="cursor"></span>
    <span class="btn pri" style="padding:7px 15px;font-size:13px">保存</span>
  </div>
  <div class="helper">点「保存」或键盘回车生效；内容未变时按钮置灰</div>
  <div class="saved"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1F6F54" stroke-width="2.5"><path d="M4 12l5 5L20 6"/></svg>已保存</div>
</div>

<!-- 帧 2：隐藏规则 · chips 预览 + 就地展开编辑 -->
<div class="phone"><div class="tag">隐藏规则编辑<small>chips 预览 + 就地展开 textarea</small></div>
  <div class="bar">
    <svg class="bt" viewBox="0 0 24 24" fill="none" stroke="#4A4840" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
    <div class="ttl">文件显示</div>
    <span class="act">恢复默认</span>
  </div>
  <div class="gh">隐藏项</div>
  <div style="display:flex;align-items:center;gap:14px;padding:8px 16px">
    <div class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1F6F54" stroke-width="1.8"><path d="M3 3l18 18M10.6 5.1A9.8 9.8 0 0121 12a16.4 16.4 0 01-3.2 3.6M6.6 6.6A16 16 0 003 12a9.8 9.8 0 0013.4 6.9"/></svg></div>
    <div style="flex:1;min-width:0">
      <div style="font-size:15px;font-weight:500;color:#26241E">隐藏默认忽略项</div>
      <div style="font-size:12.5px;color:#A5A296;margin-top:2px">点开头的文件与目录</div>
    </div>
    <div style="width:50px;height:30px;border-radius:15px;background:#1F6F54;position:relative;flex:none">
      <i style="position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff"></i>
    </div>
  </div>
  <div class="hair"></div>
  <div class="irow" style="padding-top:12px">
    <div class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1F6F54" stroke-width="1.8"><path d="M8 4h9l4 4v12H8z"/><path d="M17 4v4h4M11 12h7M11 16h5"/></svg></div>
    <div class="n1" style="flex:1">自定义隐藏规则</div>
    <span style="font-size:12.5px;color:#8A887E">4 条</span>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B8B5AA" stroke-width="2.2" style="transform:rotate(90deg)"><path d="M9 5l7 7-7 7"/></svg>
  </div>
  <div class="chips">
    <span class="chip">dist<span class="x"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#B0ADA2" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg></span></span>
    <span class="chip">build<span class="x"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#B0ADA2" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg></span></span>
    <span class="chip">assets<span class="x"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#B0ADA2" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg></span></span>
    <span class="chip">*.log<span class="x"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#B0ADA2" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg></span></span>
    <span class="chip" style="background:#fff;border:1px dashed #D4D1C5;color:#8A887E">＋ 添加</span>
  </div>
  <div class="field" style="margin-top:14px;display:flex;align-items:center;gap:9px;padding:8px 8px 8px 14px">
    <span class="ph" style="flex:1;font-size:14.5px">输入文件或目录名，如 dist</span>
    <span class="btn pri" style="padding:7px 15px;font-size:13px">添加</span>
  </div>
  <div class="helper">每条精确匹配一个文件或目录名；键盘回车也可添加，点 chip 上的 × 删除</div>
</div>
</body></html>
